<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>Catatan Latihan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F3;--surf:#fff;--ink:#16202A;--mute:#5B6773;--line:#CBD3D9;--acc:#0F766E;--accink:#fff;--plate:#F2C230;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181D;--surf:#1A2228;--ink:#E8EDF0;--mute:#93A0AA;--line:#2B353D;--acc:#2FB5A8;--accink:#08201D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181D;--surf:#1A2228;--ink:#E8EDF0;--mute:#93A0AA;--line:#2B353D;--acc:#2FB5A8;--accink:#08201D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 160px}
h1{font:700 34px/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--mute);margin:0 0 18px}
.tabs,.seg{display:flex;gap:8px;margin-bottom:16px}
.tabs button,.seg button{flex:1;padding:11px 8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 17px "Barlow Condensed",sans-serif;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button small{display:block;font:400 12px Barlow,sans-serif;opacity:.8}
.ex{padding:16px 0;border-top:1px solid var(--line)}
.ex h2{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:0}
.tg{margin:2px 0 0;font-weight:500}
.hint{margin:2px 0 10px;color:var(--mute);font-size:14px}
.set{display:flex;align-items:center;gap:8px;margin-top:8px}
.n{width:20px;color:var(--mute);font:600 18px "Barlow Condensed",sans-serif}
.set label{flex:1;display:flex;align-items:baseline;gap:6px;background:var(--surf);border:1.5px solid var(--line);border-radius:6px;padding:0 10px}
.set label:focus-within{border-color:var(--acc)}
.set input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 22px "Barlow Condensed",sans-serif;padding:8px 0;outline:none}
.set b{font-weight:400;color:var(--mute);font-size:14px}
.chk{width:46px;height:46px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--mute);font-size:20px;cursor:pointer}
.chk.on{background:var(--plate);border-color:var(--plate);color:#16202A}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar button{display:block;width:100%;max-width:560px;margin:0 auto;padding:14px;border:0;border-radius:6px;background:var(--acc);color:var(--accink);font:700 20px "Barlow Condensed",sans-serif;cursor:pointer}
.hs{padding:14px 0;border-top:1px solid var(--line)}
.hs h3{font:700 22px "Barlow Condensed",sans-serif;margin:0}
.hs p{margin:4px 0;font-size:15px}
.hs p span{color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.tools button{flex:1 1 auto;padding:10px 12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 16px "Barlow Condensed",sans-serif;border-radius:6px;cursor:pointer}
.del{margin-right:16px}
.del{margin-top:6px;background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:0}
.empty{padding:28px 0;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.x{float:right;background:none;border:0;color:var(--mute);font:400 14px Barlow,sans-serif;text-decoration:underline;cursor:pointer}
.add,.tb{padding:11px 14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 17px "Barlow Condensed",sans-serif;border-radius:6px;cursor:pointer}
.add{display:block;width:100%;margin:6px 0 12px}
textarea,select{width:100%;background:var(--surf);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:10px;font:inherit;margin-top:6px}
.ch{width:100%;height:auto;margin-top:10px}
.rt{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 auto 8px;font:700 22px "Barlow Condensed",sans-serif}
.rt[hidden]{display:none}
.bar .rt button{display:inline-block;width:auto;max-width:none;margin:0;padding:6px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--line);font-size:16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
var EX={A:[["Goblet squat",8,12],["Dumbbell bench press",8,12],["Seated row",8,12],["Dumbbell overhead press",8,12],["Romanian deadlift",8,12],["Dumbbell curl",10,15],["Plank",30,45,"dtk"]],
B:[["Leg press",8,12],["Incline dumbbell press",8,12],["Lat pulldown",8,12],["Machine shoulder press",8,12],["Leg curl",10,12],["Dumbbell curl",10,15],["Plank",30,45,"dtk"]]};
var KEY="gymlog:v1";
var wd=new Date().getDay();
var S={tab:"log",day:wd===3?"B":"A",draft:{},hist:[],bw:[],note:"",rest:0,rs:90};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);S.hist=o.hist||[];S.draft=o.draft||{};S.bw=o.bw||[];S.note=o.note||"";S.rs=o.rs||90;if(o.prog)EX=o.prog;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({hist:S.hist,draft:S.draft,bw:S.bw,note:S.note,rs:S.rs,prog:EX}))}catch(e){}}
function q(v){return String(v==null?"":v).replace(/[^0-9.,]/g,"")}
function sets(name){var k=S.day+"|"+name;if(!S.draft[k])S.draft[k]=[{kg:"",r:"",d:0},{kg:"",r:"",d:0},{kg:"",r:"",d:0}];return S.draft[k]}
function last(name){for(var i=0;i<S.hist.length;i++){if(S.hist[i].ex[name])return S.hist[i].ex[name]}return null}
function hint(name,hi,unit){var a=last(name);if(!a)return "Belum ada catatan. Mulai dari beban ringan.";
var top=Math.max.apply(null,a.map(function(x){return +x.kg||0}));
var t="Terakhir "+(top?top+" kg: ":"")+a.map(function(x){return x.r}).join(", ");
if(a.every(function(x){return +x.r>=hi})&&!unit)t+=". Semua set di batas atas, naikkan beban sedikit.";
var pr=rec(name);if(pr)t+=" Rekor: "+pr+" kg.";return t}
function rec(n){var m=0;S.hist.forEach(function(s){(s.ex[n]||[]).forEach(function(x){m=Math.max(m,+x.kg||0)})});return m}
function q2(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmtDate(iso){return new Date(iso).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"short"})}
function viewLog(){
var h='<div class="seg"><button data-day="A" aria-pressed="'+(S.day==="A")+'">Latihan A<small>Senin, Jumat</small></button><button data-day="B" aria-pressed="'+(S.day==="B")+'">Latihan B<small>Rabu</small></button></div>';
EX[S.day].forEach(function(e,i){
var name=e[0],unit=e[3],st=sets(name),lt=last(name);
h+='<section class="ex"><h2>'+name+'<button class="x" data-rm="'+i+'">Hapus</button></h2><p class="tg">3 set, '+e[1]+" sampai "+e[2]+" "+(unit||"reps")+'</p><p class="hint">'+hint(name,e[2],unit)+'</p>';
st.forEach(function(s,j){
var ph=lt&&lt[j]?lt[j].kg:"";
h+='<div class="set"><span class="n">'+(j+1)+'</span>';
if(!unit)h+='<label><input inputmode="decimal" data-k="'+i+"-"+j+'-kg" value="'+q(s.kg)+'" placeholder="'+q(ph)+'" aria-label="Beban set '+(j+1)+'"><b>kg</b></label>';
h+='<label><input inputmode="numeric" data-k="'+i+"-"+j+'-r" value="'+q(s.r)+'" placeholder="'+e[1]+'" aria-label="'+(unit||"Reps")+' set '+(j+1)+'"><b>'+(unit||"reps")+'</b></label>';
h+='<button class="chk'+(s.d?" on":"")+'" data-chk="'+i+"-"+j+'" aria-label="Tandai set '+(j+1)+' selesai">✓</button></div>';
});
h+="</section>";
});
h+='<button class="add" data-add="1">+ Tambah gerakan</button><textarea id="note" rows="2" placeholder="Catatan sesi (opsional)">'+q2(S.note)+'</textarea>';
return h}
function viewHist(){
var tools='<div class="tools"><button data-csv="all">Unduh semua (CSV)</button><button data-json="1">Backup (JSON)</button><button data-imp="1">Impor backup</button><input type="file" id="imp" accept=".json,application/json" hidden></div>';
if(!S.hist.length)return tools+'<p class="empty">Belum ada sesi. Selesaikan satu latihan, lalu tekan Simpan sesi.</p>';
return tools+S.hist.map(function(s,i){
var h='<div class="hs"><h3>'+fmtDate(s.date)+" · Latihan "+s.day+"</h3>"+(s.note?'<p><span>'+q2(s.note)+'</span></p>':"");
Object.keys(s.ex).forEach(function(n){
var u=EX[s.day].filter(function(e){return e[0]===n})[0];var unit=u&&u[3];
h+="<p>"+n+": <span>"+s.ex[n].map(function(x){return(x.kg&&!unit?x.kg+" kg × ":"")+x.r+(unit?" dtk":"")}).join(", ")+"</span></p>";
});
return h+'<button class="del" data-csv="'+i+'">Unduh sesi (CSV)</button><button class="del" data-del="'+i+'">Hapus sesi</button></div>';
}).join("")}
function render(){
var h='<h1>Catatan Latihan</h1><p class="sub">Full body, 3 kali seminggu.</p>';
h+='<div class="tabs"><button data-tab="log" aria-pressed="'+(S.tab==="log")+'">Latihan</button><button data-tab="prog" aria-pressed="'+(S.tab==="prog")+'">Progres</button><button data-tab="hist" aria-pressed="'+(S.tab==="hist")+'">Riwayat</button></div>';
h+=S.tab==="log"?viewLog():S.tab==="prog"?viewProg():viewHist();
document.getElementById("app").innerHTML=h;
var old=document.getElementById("bar");if(old)old.remove();
if(S.tab==="log"){var b=document.createElement("div");b.className="bar";b.id="bar";b.innerHTML='<div id="rt" class="rt" hidden></div><button data-save="1">Simpan sesi</button>';document.body.appendChild(b)}
tick()
}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.className="show";setTimeout(function(){el.className=""},1800)}
document.addEventListener("input",function(ev){
var k=ev.target.getAttribute&&ev.target.getAttribute("data-k");if(!k)return;
var p=k.split("-");var s=sets(EX[S.day][+p[0]][0])[+p[1]];s[p[2]]=q(ev.target.value);persist()});
document.addEventListener("click",function(ev){
var t=ev.target.closest("button");if(!t)return;
if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
if(t.dataset.day){S.day=t.dataset.day;render();return}
if(t.dataset.chk){var p=t.dataset.chk.split("-");var s=sets(EX[S.day][+p[0]][0])[+p[1]];s.d=s.d?0:1;persist();t.classList.toggle("on",!!s.d);if(s.d)startRest();return}
if(t.dataset.del!=null){if(confirm("Hapus sesi ini?")){S.hist.splice(+t.dataset.del,1);persist();render()}return}
if(t.dataset.save){
var ex={},n=0;
EX[S.day].forEach(function(e){var a=sets(e[0]).filter(function(s){return +s.r>0}).map(function(s){return{kg:s.kg,r:s.r}});if(a.length){ex[e[0]]=a;n++}});
if(!n){toast("Isi minimal satu set dulu.");return}
S.hist.unshift({date:new Date().toISOString(),day:S.day,ex:ex,note:S.note});S.note="";
Object.keys(S.draft).forEach(function(k){if(k.indexOf(S.day+"|")===0)delete S.draft[k]});
persist();S.tab="hist";render();window.scrollTo(0,0);toast("Sesi disimpan");}
});
function names(){var m={};S.hist.forEach(function(s){Object.keys(s.ex).forEach(function(n){m[n]=1})});return Object.keys(m)}
function series(n){return S.hist.filter(function(s){return s.ex[n]}).reverse().map(function(s){return Math.max.apply(null,s.ex[n].map(function(x){return+x.kg||+x.r||0}))})}
function spark(v){if(v.length<2)return '<p class="hint">Butuh minimal 2 data untuk grafik.</p>';
var w=320,h=90,mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=mx-mn||1;
var pts=v.map(function(y,i){return(8+i*(w-16)/(v.length-1)).toFixed(1)+","+(h-8-(y-mn)/r*(h-16)).toFixed(1)}).join(" ");
return '<svg viewBox="0 0 '+w+" "+h+'" class="ch" role="img" aria-label="Grafik progres"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg><p class="hint">Dari '+v[0]+" ke "+v[v.length-1]+". Tertinggi "+mx+".</p>"}
function viewProg(){
var ns=names(),h='<section class="ex"><h2>Progres gerakan</h2>';
if(!ns.length)h+='<p class="empty">Simpan satu sesi dulu untuk melihat grafik.</p>';
else{if(!S.pex||ns.indexOf(S.pex)<0)S.pex=ns[0];
h+='<select id="psel">'+ns.map(function(n){return"<option"+(n===S.pex?" selected":"")+">"+n+"</option>"}).join("")+"</select>"+spark(series(S.pex))+'<p class="hint">Rekor beban: '+(rec(S.pex)||"-")+" kg</p>"}
h+='</section><section class="ex"><h2>Berat badan</h2><div class="set"><label><input id="bwv" inputmode="decimal" placeholder="mis. 65.5"><b>kg</b></label><button class="tb" data-bw="1">Simpan</button></div>';
h+=spark(S.bw.slice().reverse().map(function(x){return+x.kg}));
h+=S.bw.slice(0,5).map(function(x,i){return'<p class="hint">'+fmtDate(x.d)+": "+x.kg+' kg <button class="del" data-bwd="'+i+'">Hapus</button></p>'}).join("")+"</section>";
return h}
var RS=[60,90,120,180];
function startRest(){S.rest=Date.now()+S.rs*1000;tick()}
function tick(){var el=document.getElementById("rt");if(!el)return;var l=S.rest-Date.now();
if(l<=0){if(S.rest){S.rest=0;if(navigator.vibrate)navigator.vibrate([200,100,200]);toast("Istirahat selesai")}el.hidden=true;return}
var h="Istirahat "+Math.floor(l/60000)+":"+("0"+Math.floor(l%60000/1000)).slice(-2)+' <button data-rs="1">'+S.rs+' dtk</button><button data-skip="1">Lewati</button>';
if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h}el.hidden=false}
setInterval(tick,500);
document.addEventListener("input",function(ev){if(ev.target.id==="note"){S.note=ev.target.value;persist()}});
document.addEventListener("change",function(ev){if(ev.target.id==="psel"){S.pex=ev.target.value;render()}});
document.addEventListener("click",function(ev){
var t=ev.target.closest("button");if(!t)return;var d=t.dataset;
if(d.rs){S.rs=RS[(RS.indexOf(S.rs)+1)%RS.length];S.rest=Date.now()+S.rs*1000;persist();tick()}
if(d.skip){S.rest=0;tick()}
if(d.rm!=null&&confirm("Hapus gerakan ini dari program?")){EX[S.day].splice(+d.rm,1);persist();render()}
if(d.add){var nm=(prompt("Nama gerakan?")||"").replace(/[<>&"']/g,"").trim().slice(0,40);if(!nm)return;
var lo=+prompt("Reps minimum?","8")||8,hi=+prompt("Reps maksimum?","12")||12;EX[S.day].push([nm,lo,hi]);persist();render()}
if(d.bw){var v=q(document.getElementById("bwv").value).replace(",",".");if(!(+v>0)){toast("Isi berat badan dulu.");return}
S.bw.unshift({d:new Date().toISOString(),kg:v});persist();render();toast("Tersimpan")}
if(d.bwd!=null){S.bw.splice(+d.bwd,1);persist();render()}
});
function dl(name,text,type){
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1500)}
function csvOf(list){
var rows=[["tanggal","latihan","gerakan","set","beban_kg","reps_atau_detik"]];
list.forEach(function(s){
var d=new Date(s.date),ds=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
Object.keys(s.ex).forEach(function(n){s.ex[n].forEach(function(x,j){rows.push([ds,s.day,n,j+1,x.kg||"",x.r])})})});
return "\ufeff"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n")}
function stamp(){var d=new Date();return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)}
document.addEventListener("click",function(ev){
var t=ev.target.closest("button");if(!t)return;
if(t.dataset.csv){
var all=t.dataset.csv==="all";var list=all?S.hist:[S.hist[+t.dataset.csv]];
if(!list.length||!list[0]){toast("Belum ada data.");return}
dl(all?"riwayat-latihan-"+stamp()+".csv":"sesi-latihan-"+stamp()+".csv",csvOf(list),"text/csv");toast("File diunduh");return}
if(t.dataset.json){dl("backup-latihan-"+stamp()+".json",JSON.stringify({v:1,hist:S.hist}),"application/json");toast("Backup diunduh");return}
if(t.dataset.imp){document.getElementById("imp").click()}
});
document.addEventListener("change",function(ev){
if(ev.target.id!=="imp"||!ev.target.files[0])return;
var r=new FileReader();
r.onload=function(){try{
var o=JSON.parse(r.result);if(!o||!Array.isArray(o.hist))throw 0;
var have={};S.hist.forEach(function(s){have[s.date]=1});
var add=o.hist.filter(function(s){return s&&s.date&&s.ex&&!have[s.date]});
S.hist=S.hist.concat(add).sort(function(a,b){return a.date<b.date?1:-1});
persist();render();toast(add.length+" sesi diimpor")}catch(e){toast("File backup tidak valid.")}};
r.readAsText(ev.target.files[0])});
render();
</script>
</body>
</html>
